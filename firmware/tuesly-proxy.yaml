# Site Bluetooth proxy for Tuesly. No light MAC is compiled into this image.
# Each board gets its own API key and setup-AP password in secrets.yaml.
substitutions:
  gateway_id: tuesly-proxy
  gateway_name: Tuesly Proxy
  firmware_version: "1.2.0"

packages:
  board: !include boards/esp32.yaml
  base: !include packages/base.yaml
  network: !include packages/network.yaml
  mesh_network: !include packages/radio.yaml
  bluetooth: !include packages/bluetooth-active.yaml
  diagnostics: !include packages/diagnostics.yaml
  bridge: !include packages/bridge.yaml
  security: !include packages/security.yaml
  recovery: !include packages/recovery.yaml

esphome:
  name_add_mac_suffix: true
  compile_process_limit: 2
  project:
    name: architechlabs.tuesly_proxy
    version: ${firmware_version}

api:
  max_send_queue: 32
  batch_delay: 20ms
