name: Tuesly Automatic Recovery
version: 0.1.11
slug: tuesly_recovery
description: Recover enrolled Tuya SIG Mesh lights after confirmed loss of pairing.
arch: [aarch64, amd64]
startup: application
boot: auto
init: false
timeout: 120
host_network: true
map:
  - type: homeassistant_config
    read_only: true
    path: /homeassistant
options:
  ha_url: http://homeassistant:8123
  ha_token: ""
  proxy_ip: ""
  proxy_key: ""
  provider_entry: ""
  bluetooth_entry: ""
  proxy_source: ""
  enabled: false
  enrolled: []
schema:
  ha_url: url
  ha_token: password
  proxy_ip: str
  proxy_key: password
  provider_entry: str
  bluetooth_entry: str
  proxy_source: str
  enabled: bool
  enrolled:
    - address: str
      uuid: str
      entry_id: str
      entity_id: str
